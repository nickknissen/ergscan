# One Cache-Control per path, set at server level, so no location needs its own add_header (which
# would drop the security headers it inherits).
map $uri $ergscan_cache_control {
    default "";
    /sw.js "no-cache";
    /manifest.webmanifest "no-cache";
    /index.html "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/tesseract/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/snippets/ergscan-headers.conf;
    add_header Cache-Control $ergscan_cache_control;

    location = /sw.js { try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location /tesseract/ { try_files $uri =404; }
    include /etc/nginx/ergscan-sync/*.conf;
    location / { try_files $uri $uri/ /index.html; }
}
