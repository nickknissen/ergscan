# Rate limits for the sync API. The web-sync image copies this into /etc/nginx/conf.d/, the http
# context, which limit_req_zone needs; the locations that use the zones are in nginx-sync.conf.

# Behind a reverse proxy (Coolify's Traefik, Caddy, …) every request comes from the proxy, so the
# limits would treat all users as one client. Take the client address from X-Forwarded-For, but
# only when the request comes from one of these networks: narrow them to your proxy's network.
# Trusting a network your users can send from lets them pick any address and skip the limits.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Only POSTs count; an empty key isn't limited, so deleting a vault is never refused.
map $request_method $ergscan_sync_client {
    default "";
    POST $binary_remote_addr;
}

# Creating a vault lets a client store up to 8 MiB, so it gets the slowest rate nginx has
# (it can't count per hour). ERGSCAN_SYNC_MAX_BYTES caps the total behind it.
limit_req_zone $ergscan_sync_client zone=ergscan_sync_vault:1m rate=1r/m;
# New link invites and recovery attempts: cheap, but not unlimited.
limit_req_zone $ergscan_sync_client zone=ergscan_sync_access:1m rate=30r/m;
