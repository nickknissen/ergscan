location ^~ /api/sync/ {
    client_max_body_size 9m;
    proxy_pass http://sync:8787;
    proxy_http_version 1.1;
    access_log off;
    # The server block adds nosniff to every response already; don't send it twice.
    proxy_hide_header X-Content-Type-Options;
    # The zones are in nginx-sync-limits.conf. Only requests that create something are limited:
    # every open tab polls /history, and a linking device polls POST /pair/<id> about 33 times a
    # minute while the other device, often behind the same address, approves with PUT /pair/<id>.
    limit_req_status 429;

    location = /api/sync/vault {
        limit_req zone=ergscan_sync_vault burst=2 nodelay;
        proxy_pass http://sync:8787;
    }
    location = /api/sync/pair {
        limit_req zone=ergscan_sync_access burst=10 nodelay;
        proxy_pass http://sync:8787;
    }
    location = /api/sync/recover {
        limit_req zone=ergscan_sync_access burst=10 nodelay;
        proxy_pass http://sync:8787;
    }
}
