# Security headers for every response of the web image, installed as
# /etc/nginx/snippets/ergscan-headers.conf and included in nginx.conf's server block. nginx drops
# inherited add_header directives in any location that sets its own, so locations set none.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self'; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
