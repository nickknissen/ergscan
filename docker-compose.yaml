# Sync-enabled deployment for Coolify (Docker Compose build pack).
# Assign the public domain to the `web` service in Coolify; no host ports are bound.
services:
  web:
    build:
      context: .
      target: web-sync
      args:
        VITE_ERGSCAN_SYNC: "true"
    expose:
      - "80"
    depends_on:
      sync:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
  sync:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      ERGSCAN_SYNC_HOST: "0.0.0.0"
      ERGSCAN_SYNC_DB: /data/history.sqlite
      # Total snapshot bytes the server stores before refusing uploads; shown as a setting in Coolify.
      ERGSCAN_SYNC_MAX_BYTES: ${ERGSCAN_SYNC_MAX_BYTES:-1073741824}
    volumes:
      - ergscan-sync-data:/data
    healthcheck:
      # Unauthenticated requests get 401, which proves the API is answering.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/sync/history').then(r=>process.exit(r.status===401?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

volumes:
  ergscan-sync-data:
